        async function fetchUsersFromGoogleSheets() {
            const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json&sheet=DB_USER`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?/);
                if (!match || !match[1]) throw new Error("Format respons tidak valid");
                
                const jsonData = JSON.parse(match[1]);
                const users = [];
                
                jsonData.table.rows.forEach(r => {
                    if (r && r.c) {
                        const getVal = (cell) => {
                            if (!cell) return '';
                            return cell.f !== undefined ? cell.f : (cell.v !== undefined ? cell.v : '');
                        };

                        const u = getVal(r.c[0]);
                        const role = getVal(r.c[1]);
                        const pass = getVal(r.c[2]);
                        
                        const parsedUser = String(u).trim();
                        const parsedRole = String(role).trim().toLowerCase();
                        const parsedPass = String(pass).trim();

                        if (parsedUser && parsedUser.toLowerCase() !== 'user' && parsedUser.toLowerCase() !== 'username') { 
                            users.push({ 
                                user: parsedUser, 
                                role: parsedRole, 
                                pass: parsedPass 
                            });
                        }
                    }
                });
                return users;
            } catch (err) {
                console.error('Error fetching users from DB_USER:', err);
                return [];
            }
        }

        async function fetchSheetFromGoogleSheets(sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?/);
                if (!match || !match[1]) throw new Error("Format respons tidak valid");
                
                const jsonData = JSON.parse(match[1]);
                const rows = [];
                
                jsonData.table.rows.forEach((r, idx) => {
                    if (r && r.c) {
                        const getVal = (colIndex) => (r.c[colIndex] ? (r.c[colIndex].f !== undefined ? r.c[colIndex].f : r.c[colIndex].v) : '');
                        
                        const rowObj = {
                            colA: String(getVal(0) || `ID-${idx+1}`),
                            colB: String(getVal(1) || ''),
                            colC: String(getVal(2) || ''),
                            colD: String(getVal(3) || ''),
                            colE: String(getVal(4) ? String(getVal(4)).split('T')[0] : '2026-08-05'),
                            colF: String(getVal(5) || ''),
                            colG: String(getVal(6) || ''),
                            colH: String(getVal(7) || ''),
                            colI: Number(getVal(8)) || 0,
                            colJ: Number(getVal(9)) || 0,
                            colK: Number(getVal(10)) || 5, // Kolom 11: Plate Baik
                            colL: Number(getVal(11)) || 0, // Kolom 12: Plate Rusak
                            colM: String(getVal(12) || ''),
                            colN: String(getVal(13) || ''),
                            colO: String(getVal(14) || ''),
                            colP: String(getVal(15) || '1'),
                            colQ: String(getVal(16) || ''),
                            colR: String(getVal(17) || '')
                        };
                        
                        if (rowObj.colA && rowObj.colA.toLowerCase() !== 'id (1)' && rowObj.colA.toLowerCase() !== 'id') {
                            rows.push(rowObj);
                        }
                    }
                });
                return rows;
            } catch (err) {
                console.error(`Error fetching sheet ${sheetName}:`, err);
                return null;
            }
        }

        async function fetchData() {
            state.isLoading = true;
            renderMain(); 

            const sheetName = dbSheets[state.activeSubTab];
            let sheetData = await fetchSheetFromGoogleSheets(sheetName);
            
            if (sheetData && sheetData.length > 0) {
                state.data = sheetData.sort((a, b) => new Date(a.colE) - new Date(b.colE));
                state.isLoading = false;
                updateContent();
            } else {
                db.ref(sheetName).once('value')
                    .then((snapshot) => {
                        const rawData = snapshot.val();
                        if (rawData && Object.keys(rawData).length > 0) {
                            state.data = Object.values(rawData).sort((a, b) => new Date(a.colE) - new Date(b.colE));
                        } else {
                            state.data = generateSampleData(state.activeSubTab);
                        }
                        state.isLoading = false;
                        updateContent();
                    })
                    .catch((error) => {
                        console.error("Firebase fallback error:", error);
                        state.data = generateSampleData(state.activeSubTab);
                        state.isLoading = false;
                        updateContent();
                    });
            }
        }

        function generateSampleData(dept) {
            const term = deptTerms[dept];
            return [
                {
                    colA: `${dept}-101`, colB: `Sample ${term} 1`, colC: "102394", colD: `PL-${dept}-01`,
                    colE: "2026-08-05", colF: "CRON 01", colG: "KBA 01", colH: "HVS 80gr",
                    colI: 10, colJ: 1, colK: 9, colL: 1, colM: "Scratch", colN: "Urgent", colO: "Goresan",
                    colP: "1", colQ: "Ahmad", colR: "Budi"
                }
            ];
        }

        function getItemTerm() {
            return deptTerms[state.activeSubTab] || 'Plate';
        }

        function persistData(itemObj, isNew, callback) {
            const nodeName = dbSheets[state.activeSubTab];
            const dataId = itemObj.colA;

            if (!dataId) {
                showToast("ID Data (colA) tidak boleh kosong", "error");
                callback(false);
                return;
            }

            db.ref(`${nodeName}/${dataId}`).set(itemObj)
                .then(() => callback(true))
                .catch((error) => {
                    console.error("Firebase save error: ", error);
                    callback(false);
                });
        }

        function removeData(id, callback) {
            const nodeName = dbSheets[state.activeSubTab];

            db.ref(`${nodeName}/${id}`).remove()
                .then(() => callback(true))
                .catch((error) => {
                    console.error("Firebase delete error: ", error);
                    callback(false);
                });
        }

                                </div>

                                        class="w-full pl-10 pr-10 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-500">

                            <button type="submit" id="btn-login-submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 text-sm mt-4">
                                <span>Masuk ke Sistem</span>
                                <i class="fas fa-arrow-right text-xs"></i>
                            </button>

                    </div>

            `;

        function togglePasswordVisibility() {
            const passInput = document.getElementById('login-password');
            const icon = document.getElementById('password-toggle-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value.trim();
            const errDiv = document.getElementById('login-error');
            const submitBtn = document.getElementById('btn-login-submit');

            if (!usernameInput || !passwordInput) {
                document.getElementById('login-error-msg').innerText = "Harap isi Username dan Password!";
                errDiv.classList.remove('hidden');
                return;
            }

            errDiv.classList.add('hidden');
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.classList.replace('bg-blue-600', 'bg-blue-800');
            submitBtn.innerHTML = `<div class="loader !w-4 !h-4 !border-2"></div><span class="ml-2">Memeriksa Google Sheets DB_USER...</span>`;

            const users = await fetchUsersFromGoogleSheets();
            
            const matchedUser = users.find(u => 
                u.user.toLowerCase() === usernameInput.toLowerCase() && 
                u.pass === passwordInput
            );

            if (matchedUser) {
                state.username = matchedUser.user;
                state.userRole = matchedUser.role || 'operator';
                showToast(`Selamat datang, ${state.username} (${state.userRole})`, 'success');
                fetchData();
            } else {
                submitBtn.disabled = false;
                submitBtn.classList.replace('bg-blue-800', 'bg-blue-600');
                submitBtn.innerHTML = originalBtnHtml;
                document.getElementById('login-error-msg').innerText = "Username atau password salah / tidak ditemukan di DB_USER!";
                errDiv.classList.remove('hidden');
            }
        }

            if(!state.isLoading) updateContent();
        }

        function toggleSidebar(open) {
            state.sidebarOpen = open !== undefined ? open : !state.sidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            
            if (sidebar && backdrop) {
                if (state.sidebarOpen) {
                    sidebar.classList.remove('-translate-x-full');
                    sidebar.classList.add('translate-x-0');
                    backdrop.classList.remove('hidden', 'opacity-0');
                    backdrop.classList.add('block', 'opacity-100');
                } else {
                    sidebar.classList.remove('translate-x-0');
                    sidebar.classList.add('-translate-x-full');
                    backdrop.classList.remove('block', 'opacity-100');
                    backdrop.classList.add('hidden', 'opacity-0');
                }
            }
        }

        function switchTab(mainTab, subTab) {
            state.activeMainTab = mainTab;
            if (window.innerWidth < 1024) {
                toggleSidebar(false);
            }

            if (subTab && state.activeSubTab !== subTab) {
                state.activeSubTab = subTab;
                fetchData();
            } else {
                renderMain();
            }
        }

        function updateContent() {
            const container = document.getElementById('main-content');
            if (state.activeMainTab === 'dashboard') renderDashboard(container);
            else if (state.activeMainTab === 'database') renderDatabase(container);
        }

        function getFilteredData() {
            if (!state.startDate || !state.endDate) return state.data;
            const start = new Date(state.startDate);
            const end = new Date(state.endDate);
            end.setHours(23, 59, 59); 
            
            return state.data.filter(d => {
                if(!d.colE) return false;
                const itemDate = new Date(d.colE);
                return itemDate >= start && itemDate <= end;
            });
        }

        function resetDateFilter() {
            state.startDate = defaultStartDate;
            state.endDate = defaultEndDate;
            updateContent();
            showToast("Filter tanggal telah direset", "info");
        }

        function renderDashboard(container) {
            const filteredData = getFilteredData();
            const term = getItemTerm();
            
            // Rumus baru sesuai permintaan untuk CTCP:
            // Total Plate Baik = kolom 11 (colK)
            // Total Plate Rusak = kolom 12 (colL)
            // Total Plate Ganti = kolom 10 (colJ)
            // Total Penggunaan = kolom 11 (colK) + kolom 12 (colL)
            // Persentase Rusak = (kolom 12 / (kolom 11 + kolom 12)) * 100%
            const totalBaik = filteredData.reduce((sum, item) => sum + (Number(item.colK) || 0), 0);
            const totalRusak = filteredData.reduce((sum, item) => sum + (Number(item.colL) || 0), 0);
            const totalGanti = filteredData.reduce((sum, item) => sum + (Number(item.colJ) || 0), 0);
            const totalPenggunaan = totalBaik + totalRusak;
            const pctRusak = totalPenggunaan > 0 ? ((totalRusak / totalPenggunaan) * 100).toFixed(1) : 0;

            container.innerHTML = `
                <div class="max-w-7xl mx-auto space-y-6">
                    <div class="flex flex-wrap justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200 no-print">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800"><i class="fas fa-chart-line text-blue-500 mr-2"></i> Dashboard Kinerja - ${state.activeSubTab}</h2>
                            <!-- Subtitle info 'Istilah unit' dihilangkan khusus CTCP sesuai permintaan -->
                            ${state.activeSubTab !== 'CTCP' ? `<p class="text-xs text-slate-500">Istilah unit: <strong class="text-blue-600">${term}</strong> | Sheet: <strong class="font-mono text-slate-700">${dbSheets[state.activeSubTab]}</strong></p>` : ''}
                        </div>
                        <div class="flex flex-wrap items-center gap-2 mt-3 sm:mt-0 filter-bar">
                            <input type="date" id="dash-start-date" value="${state.startDate}" class="p-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                            <span class="text-slate-400 text-sm">s/d</span>
                            <input type="date" id="dash-end-date" value="${state.endDate}" class="p-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                            <button onclick="applyDateFilter()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition-colors">
                                <i class="fas fa-filter mr-1"></i> Filter
                            </button>
                            <button onclick="resetDateFilter()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition-colors" title="Reset Filter">
                                <i class="fas fa-undo mr-1"></i> Reset
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                        ${createCard(`Total ${term} Baik`, totalBaik, 'pcs', 'fa-check-circle', 'text-emerald-500', 'bg-emerald-50', 'baik')}
                        ${createCard(`Total ${term} Rusak`, totalRusak, 'pcs', 'fa-times-circle', 'text-rose-500', 'bg-rose-50', 'rusak')}
                        ${createCard(`Total ${term} Ganti`, totalGanti, 'pcs', 'fa-sync', 'text-amber-500', 'bg-amber-50', 'ganti')}
                        ${createCard('Total Penggunaan', totalPenggunaan, 'pcs', 'fa-layer-group', 'text-blue-500', 'bg-blue-50', 'penggunaan')}
                        ${createCard('Persentase Rusak', pctRusak, '%', 'fa-percent', 'text-purple-500', 'bg-purple-50', 'persentase')}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-3 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                                <h3 class="font-semibold text-slate-700">Grafik Penggunaan ${term} Harian</h3>
                                <span class="text-xs text-blue-500 bg-blue-50 px-2 py-1 rounded"><i class="fas fa-mouse-pointer mr-1"></i>Klik poin grafik untuk detail</span>
                            </div>
                            <div class="h-72"><canvas id="chartDaily"></canvas></div>
                        </div>
                        <div class="lg:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                                <h3 class="font-semibold text-slate-700">Kategori JOP</h3>
                                <span class="text-xs text-purple-500 bg-purple-50 px-2 py-1 rounded"><i class="fas fa-mouse-pointer mr-1"></i>Klik batang untuk detail</span>
                            </div>
                            <div class="h-80"><canvas id="chartJop"></canvas></div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                            <div class="flex justify-between items-center mb-4 pb-2 border-b">
                                <h3 class="font-semibold text-slate-700">Mesin Expose</h3>
                                <span class="text-xs text-emerald-500 bg-emerald-50 px-2 py-1 rounded"><i class="fas fa-mouse-pointer mr-1"></i>Klik diagram</span>
                            </div>
                            <div class="h-80"><canvas id="chartMesin"></canvas></div>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => initCharts(filteredData), 50);
        }

        function createCard(title, value, unit, icon, iconColor, bgColor, type) {
            return `
                <div onclick="showCardDetail('${type}')" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col relative overflow-hidden hover:shadow-md hover:border-blue-300 transition-all cursor-pointer group">
                    <div class="flex justify-between items-start z-10">
                        <div>
                            <p class="text-xs font-medium text-slate-500 mb-1 uppercase tracking-wide">${title}</p>
                            <h3 class="text-2xl font-bold text-slate-800 group-hover:text-blue-600 transition-colors">${value.toLocaleString()} <span class="text-xs text-slate-400 font-normal">${unit}</span></h3>
                        </div>
                        <div class="w-10 h-10 rounded-xl ${bgColor} flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i class="fas ${icon} ${iconColor} text-lg"></i>

                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                        <span>Lihat Rincian</span>
                        <i class="fas fa-arrow-right text-slate-300 group-hover:text-blue-500 transition-colors"></i>
                    </div>
                </div>
            `;
        }

        function applyDateFilter() {
            state.startDate = document.getElementById('dash-start-date').value;
            state.endDate = document.getElementById('dash-end-date').value;
            updateContent();
        }

        function initCharts(data) {
            Object.values(state.charts).forEach(chart => chart.destroy());
            state.charts = {};

            const term = getItemTerm();

            // Grafik Penggunaan Harian: Berdasarkan tanggal kolom 5 (colE) dan nilai penggunaan (kolom 11 + kolom 12) untuk CTCP
            const dailyMap = {};
            data.forEach(d => {
                const date = d.colE;
                if(!date) return;
                const usage = (Number(d.colK)||0) + (Number(d.colL)||0);
                dailyMap[date] = (dailyMap[date] || 0) + usage;
            });
            const sortedDates = Object.keys(dailyMap).sort();
            
            const dailyCanvas = document.getElementById('chartDaily');
            if(dailyCanvas) {
                state.charts.daily = new Chart(dailyCanvas, {
                    type: 'line',
                    data: {
                        labels: sortedDates,
                        datasets: [{ 
                            label: `Penggunaan ${term}`, 
                            data: sortedDates.map(date => dailyMap[date]), 
                            borderColor: '#3b82f6', 
                            backgroundColor: 'rgba(59, 130, 246, 0.1)', 
                            fill: true, 
                            tension: 0.3,
                            pointRadius: 5,
                            pointHoverRadius: 8
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        plugins: { legend: { display: false } },
                        onClick: (e, elements) => {
                            if (elements.length > 0) {
                                const index = elements[0].index;
                                const clickedDate = sortedDates[index];
                                const items = data.filter(d => d.colE === clickedDate);
                                showDetailModal(`Detail Penggunaan ${term} Tanggal: ${clickedDate}`, items);
                            }
                        }
                    }
                });
            }

            // Kategori JOP: Berdasarkan nomor JOP di kolom 3 (colC)
            const jopMap = {};
            data.forEach(d => {
                const category = jopCategories[String(d.colC).charAt(0)] || 'OTHERS';
                jopMap[category] = (jopMap[category] || 0) + 1;
            });
            const jopCanvas = document.getElementById('chartJop');
            if(jopCanvas) {
                const categories = Object.keys(jopMap);
                state.charts.jop = new Chart(jopCanvas, {
                    type: 'bar',
                    data: {
                        labels: categories,
                        datasets: [{ label: 'Jumlah Transaksi', data: Object.values(jopMap), backgroundColor: '#8b5cf6', borderRadius: 6 }]
                    },
                    options: { 
                        indexAxis: 'y', 
                        responsive: true, 
                        maintainAspectRatio: false,
                        onClick: (e, elements) => {
                            if (elements.length > 0) {
                                const index = elements[0].index;
                                const category = categories[index];
                                const items = data.filter(d => (jopCategories[String(d.colC).charAt(0)] || 'OTHERS') === category);
                                showDetailModal(`Detail Kategori JOP: ${category}`, items);
                            }
                        }
                    }
                });
            }

            // Mesin Expose: Dari kolom 6 (colF) untuk CTCP
            const mesinMap = {};
            data.forEach(d => {
                const m = d.colF || 'Tidak Diketahui';
                mesinMap[m] = (mesinMap[m] || 0) + 1;
            });
            const mesinCanvas = document.getElementById('chartMesin');
            if(mesinCanvas) {
                const mesinList = Object.keys(mesinMap);
                state.charts.mesin = new Chart(mesinCanvas, {
                    type: 'doughnut',
                    data: {
                        labels: mesinList,
                        datasets: [{ data: Object.values(mesinMap), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'], borderWidth: 0 }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        cutout: '65%',
                        onClick: (e, elements) => {
                            if (elements.length > 0) {
                                const index = elements[0].index;
                                const mesinName = mesinList[index];
                                const items = data.filter(d => (d.colF || 'Tidak Diketahui') === mesinName);
                                showDetailModal(`Detail Mesin Expose: ${mesinName}`, items);
                            }
                        }
                    }
                });
            }
        }

        function showCardDetail(type) {
            const data = getFilteredData();
            const term = getItemTerm();
            let items = [];
            let title = '';

            if (type === 'baik') {
                title = `Daftar ${term} Baik`;
                items = data.filter(d => Number(d.colK) > 0);
            } else if (type === 'rusak') {
                title = `Daftar ${term} Rusak`;
                items = data.filter(d => Number(d.colL) > 0);
            } else if (type === 'ganti') {
                title = `Daftar ${term} Ganti`;
                items = data.filter(d => Number(d.colJ) > 0);
            } else {
                title = `Seluruh Transaksi Penggunaan ${term}`;
                items = data;
            }

            showDetailModal(title, items);
        }

        function showDetailModal(title, items) {
            const cols = deptColumns[state.activeSubTab];
            const modalHtml = `
                <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onclick="closeModal(event, 'detail-modal')">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[85vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">
                        <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
                            <div>
                                <h3 class="text-lg font-bold text-slate-800"><i class="fas fa-list-alt text-blue-500 mr-2"></i> ${title}</h3>
                                <p class="text-xs text-slate-500">Ditemukan ${items.length} data detail</p>
                            </div>
                            <button onclick="closeModal(null, 'detail-modal')" class="text-slate-400 hover:text-rose-600 p-1"><i class="fas fa-times text-xl"></i></button>

                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-slate-100 border-b text-slate-600 sticky top-0">
                                    <tr>
                                        ${cols.map(c => `<th class="py-2.5 px-3 font-semibold ${c==='colB'?'max-w-[120px] truncate':''}">${columnLabels[c]}</th>`).join('')}
                                        <th class="py-2.5 px-3 font-semibold text-center">BAIK</th>
                                        <th class="py-2.5 px-3 font-semibold text-center">RUSAK</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${items.length === 0 ? `<tr><td colspan="${cols.length + 2}" class="text-center py-8 text-slate-400">Tidak ada data rincian.</td></tr>` : ''}
                                    ${items.map(row => `
                                        <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="openFullRowDetail('${row.colA}')">
                                            ${cols.map(c => `<td class="py-2.5 px-3 ${c==='colB'?'max-w-[120px] truncate':''}">${row[c] || '-'}</td>`).join('')}
                                            <td class="py-2.5 px-3 text-center text-emerald-600 font-bold">${row.colK || 0}</td>
                                            <td class="py-2.5 px-3 text-center text-rose-600 font-bold">${row.colL || 0}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        <div class="px-6 py-3 bg-slate-50 border-t flex justify-between items-center text-xs text-slate-500">
                            <span>* Klik pada salah satu baris untuk melihat seluruh data lengkap</span>
                            <button onclick="closeModal(null, 'detail-modal')" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 font-medium">Tutup</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;
            document.body.classList.add('modal-open');
        }

       function renderDatabase(container) {

        function printDatabase() {
            window.print();
        }

        function openFullRowDetailByIndex(index) {
            const item = state.data[index];
            if(item) openFullRowDetail(item.colA);
        }

        function openFullRowDetail(id) {
            const item = state.data.find(d => d.colA === id);
            if(!item) return;

            const allCols = deptColumns[state.activeSubTab];

            const modalHtml = `
                <div id="full-detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4" onclick="closeModal(event, 'full-detail-modal')">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">

        function openForm(mode, index = null) {
            state.formMode = mode;
            let item = {};
            
            if (mode === 'edit' && index !== null) {
                item = state.data[index];
                state.editIndex = index;
            } else {
                item = { 
                    colE: new Date().toISOString().split('T')[0],
                    colA: `${state.activeSubTab}-${Date.now().toString().slice(-5)}` 
                };
            }

            const term = getItemTerm();
            const cols = deptColumns[state.activeSubTab];

            const formHtml = `
                <div id="form-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onclick="closeModal(event, 'form-modal')">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">
                        <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
                            <h3 class="text-lg font-bold text-slate-800"><i class="fas ${mode==='add' ? 'fa-plus' : 'fa-edit'} text-blue-500 mr-2"></i> ${mode === 'add' ? 'Tambah Data Baru' : 'Edit Data'} - ${state.activeSubTab} (${term})</h3>
                            <button onclick="closeModal(null, 'form-modal')" class="text-slate-400 hover:text-rose-600 p-1"><i class="fas fa-times text-xl"></i></button>
                        </div>
                        <form id="dataForm" onsubmit="handleSave(event)" class="overflow-y-auto p-6 relative flex-1">
                            <div id="form-overlay" class="hidden absolute inset-0 bg-white/80 z-10 flex items-center justify-center">
                                <div class="loader"></div><span class="ml-2 font-medium text-slate-600">Menyimpan...</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-x-6 gap-y-4">
                                ${cols.map(key => {
                                    let type = 'text';
                                    if (key === 'colE') type = 'date';
                                    if (['colI','colJ','colK','colL'].includes(key)) type = 'number';
                                    let readonly = (key === 'colA');
                                    return createInput(key, columnLabels[key], item[key], type, readonly);
                                }).join('')}
                            </div>
                            <div class="mt-8 pt-4 border-t flex justify-end gap-3 sticky bottom-0 bg-white">
                                <button type="button" onclick="closeModal(null, 'form-modal')" class="px-5 py-2 bg-slate-100 text-slate-600 rounded-lg font-medium hover:bg-slate-200">Batal</button>
                                <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-sm font-medium"><i class="fas fa-save mr-1"></i> Simpan</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = formHtml;
            document.body.classList.add('modal-open');
        }

        function createInput(id, label, value = '', type = 'text', readonly = false) {
            return `
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-slate-600">${label}</label>
                    <input type="${type}" id="${id}" name="${id}" value="${value !== undefined && value !== null ? value : ''}" ${readonly ? 'readonly' : ''} 
                        class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none ${readonly ? 'bg-slate-100 text-slate-500' : 'bg-white'}">
                </div>
            `;
        }

        function handleSave(event) {
            event.preventDefault();
            document.getElementById('form-overlay').classList.remove('hidden');
            
            const formData = new FormData(event.target);
            const newItem = {};
            for (let [key, value] of formData.entries()) {
                newItem[key] = value;
            }

            const isNew = state.formMode === 'add';
            
            persistData(newItem, isNew, function(success) {
                if(success) {
                    closeModal(null, 'form-modal');
                    showToast('Data berhasil disimpan!', 'success');
                    fetchData();
                } else {
                    document.getElementById('form-overlay').classList.add('hidden');
                    showToast('Gagal menyimpan data.', 'error');
                }
            });
        }

        function confirmDelete(index) {
            const item = state.data[index];
            const html = `
                <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full text-center relative overflow-hidden">
                        <div id="delete-overlay" class="hidden absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center">
                            <div class="loader mb-2"></div><span class="text-sm font-medium text-slate-600">Menghapus...</span>
                        </div>
                        <div class="w-14 h-14 bg-rose-100 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-xl">
                            <i class="fas fa-trash-alt"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-1">Hapus Data ID: ${item.colA}?</h3>
                        <p class="text-slate-500 text-xs mb-6">Tindakan ini akan menghapus data secara permanen.</p>
                        <div class="flex gap-3 justify-center">
                            <button onclick="closeModal(null, 'confirm-modal')" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-200">Batal</button>
                            <button onclick="executeDelete(${index}, '${item.colA}')" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-sm font-medium shadow-sm">Ya, Hapus</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').insertAdjacentHTML('beforeend', html);
        }

        function executeDelete(index, id) {
            document.getElementById('delete-overlay').classList.remove('hidden');
            removeData(id, function(success) {
                if(success) {
                    closeModal(null, 'confirm-modal');
                    showToast('Data berhasil dihapus.', 'success');
                    fetchData();
                } else {
                    document.getElementById('delete-overlay').classList.add('hidden');
                    showToast('Gagal menghapus data.', 'error');
                }
            });
        }

        function closeModal(event, modalId) {
            if (event && event.target.id !== modalId) return;
            const modal = document.getElementById(modalId);
            if (modal) modal.remove();
            if (!document.querySelector('[id$="-modal"]')) document.body.classList.remove('modal-open');
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-emerald-600' : (type === 'info' ? 'bg-blue-600' : 'bg-rose-600');
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'info' ? 'fa-info-circle' : 'fa-exclamation-triangle');
            
            toast.className = `fixed bottom-6 right-6 ${color} text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-[100] transition-all duration-300 translate-y-10 opacity-0 text-sm font-medium`;
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.onload = renderLogin;
    </script>
</body>
</html>
